name: Update GitHub Language Composition

on:
  schedule:
    # Run every day at 00:00 UTC
    - cron: "0 0 * * *"

  # Allow manual execution
  workflow_dispatch:

concurrency:
  group: github-language-composition
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  update-languages:

    runs-on: ubuntu-latest

    steps:

      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.x"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install requests

      - name: Calculate language composition
        run: |
          python scripts/github_languages.py

      - name: Commit updated SVG
        run: |

          git config user.name "github-actions[bot]"

          git config user.email \
            "41898282+github-actions[bot]@users.noreply.github.com"

          # Get latest main
          git fetch origin main

          # Rebase on latest main
          git rebase origin/main

          # Stage generated SVG
          git add assets/github-languages.svg

          # Commit only if SVG changed
          if git diff --cached --quiet; then

            echo "No changes to language statistics."

          else

            git commit \
              -m "chore: update language composition"

            git push origin HEAD:main

          fi
