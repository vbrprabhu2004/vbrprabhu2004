name: Update GitHub Language Composition

on:
  schedule:
    - cron: "0 0 * * *"

  workflow_dispatch:

permissions:
  contents: write

jobs:
  update-languages:

    runs-on: ubuntu-latest

    steps:

      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.x"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install requests

      - name: Calculate language composition
        run: |
          python scripts/github_languages.py

      - name: Commit updated SVG
        run: |

          git config user.name "github-actions[bot]"

          git config user.email \
            "41898282+github-actions[bot]@users.noreply.github.com"

          git add assets/github-languages.svg

          if git diff --cached --quiet; then

            echo "No changes to language statistics."

          else

            git commit \
              -m "chore: update language composition"

            git push

          fi
